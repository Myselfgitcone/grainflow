[project]
name = "grainflow"
version = "0.1.0"
description = "Streaming lakehouse for grain market, weather and crop data."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "confluent-kafka>=2.6",
    "httpx>=0.27",
    "jsonschema[format-nongpl]>=4.23",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-settings>=2.6",
    "pyiceberg[pyarrow,sql-postgres,sql-sqlite]>=0.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.10",
    "dagster-dbt>=0.26",
    "dagster-postgres>=0.26",
    "dagster-webserver>=1.10",
    "dbt-core>=1.9",
    "dbt-trino>=1.9",
    "trino>=0.330",
]

[project.scripts]
grainflow = "grainflow.cli:app"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "pyspark>=3.5",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grainflow"]

[tool.ruff]
line-length = 100
target-version = "py310"  # the Spark image ships Python 3.10

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Java runtime for PySpark"]
