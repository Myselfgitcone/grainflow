version: 2

seeds:
  - name: ref_symbols
    description: Futures tickers we ingest and the commodity each one prices.
    columns:
      - name: symbol
        data_tests: [unique, not_null]

  - name: ref_crop_progress_states
    description: >
      The 18 states per crop that USDA's national Crop Progress report rates.
      NASS also publishes condition for minor states (CT, RI, VT...); averaging
      those in with equal weight would drown out the states that set prices.
    data_tests:
      - unique_combination:
          arguments:
            columns: [commodity, state_alpha]

  # Fixtures mirror the bronze Iceberg tables column for column.
  - name: price_bars
    config:
      column_types:
        bar_start: timestamptz
        _kafka_timestamp: timestamptz
        _ingested_at: timestamptz
        volume: bigint

  - name: weather_observations
    config:
      column_types:
        observed_at: timestamptz
        precipitation_last_hour_mm: double
        _kafka_timestamp: timestamptz
        _ingested_at: timestamptz

  - name: crop_condition
    config:
      column_types:
        week_ending: date
        pct: double
        nass_load_time: timestamptz
        _kafka_partition: integer
        _kafka_offset: bigint
        _kafka_timestamp: timestamptz
        _ingested_at: timestamptz

  - name: quarantine
    config:
      column_types:
        topic: varchar
        kafka_partition: integer
        kafka_offset: bigint
        _ingested_at: timestamptz
