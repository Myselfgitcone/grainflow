# Iceberg catalog "lake": JDBC catalog in Postgres, data files in S3 (SeaweedFS locally).
# Trino and pyiceberg point at the same Postgres tables, so all three see one lake.
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.catalog-impl          org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lake.uri                   jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lake.jdbc.user             grainflow
spark.sql.catalog.lake.jdbc.password         grainflow
spark.sql.catalog.lake.warehouse             s3://warehouse/
spark.sql.catalog.lake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint           http://s3:8333
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.defaultCatalog                     lake

spark.sql.session.timeZone                   UTC
spark.sql.shuffle.partitions                 4
spark.jars.ivy                               /opt/spark/ivy
