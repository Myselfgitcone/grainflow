name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # contract compatibility diffs against the base branch
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --all-extras --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Contracts
        run: |
          uv run grainflow contracts check
          uv run grainflow contracts dbt-sources --check

      - name: Breaking contract changes need a version bump
        if: github.event_name == 'pull_request'
        run: uv run grainflow contracts compat --against origin/${{ github.base_ref }}

      - name: Tests
        run: uv run pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --frozen

      - name: dbt build on DuckDB fixtures
        working-directory: transform
        env:
          DBT_TARGET: ci
        run: uv run dbt build --profiles-dir . --target-path target-ci

      - name: Dagster definitions load against the Trino manifest
        env:
          DBT_TARGET: trino
          DAGSTER_HOME: /tmp/dagster
        run: |
          mkdir -p "$DAGSTER_HOME"
          uv run dbt parse --project-dir transform --profiles-dir transform --target trino
          uv run dagster definitions validate -m grainflow.orchestration.definitions

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
